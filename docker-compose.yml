# ============================================================================
# SUPERSEDED — do not deploy from this file.
#
# This is the old single-host layout, where the backend, frontend, Postgres and
# nmap all ran on the HCU server. The deployment is now split:
#
#   HCU server → Postgres + Ollama    ... docker-compose.hcu.yml
#   Mac mini   → backend + nmap + site ... native, see DEPLOY.md Part B
#
# The `backend` service below CANNOT run on the Mac mini: network_mode: host and
# cap_add: NET_RAW are Linux-kernel features, and under Docker Desktop for macOS
# they apply to the Linux VM rather than the Mac, so nmap would scan the VM.
#
# Kept for reference only — if Surge ever moves back to one Linux box, start here.
# ============================================================================

# Surge — full-stack deployment for the university server.
#
# Topology notes (these are deliberate, not defaults):
#   * backend uses host networking + NET_RAW/NET_ADMIN so nmap can do real host
#     discovery and SYN scans on the lab network, and so it reaches the Ollama
#     model and Postgres on localhost. This trades away container network
#     isolation — unavoidable for a scanner.
#   * db publishes 5432 to the host so the host-networked backend can reach it
#     at localhost:5432.
#   * frontend is a normal bridged container; all its API/WebSocket calls happen
#     in the browser, pointed at the server's Tailscale address (build args).
#
# Copy .env.example -> .env and fill it in before running.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: surge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: surge
    ports:
      - "127.0.0.1:5432:5432"   # only the host (incl. host-net backend) can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surge -d surge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./surge-ai
    restart: unless-stopped
    network_mode: host          # see topology notes above
    cap_add:
      - NET_RAW                 # raw sockets for nmap SYN/host discovery
      - NET_ADMIN
    environment:
      DATABASE_URL: postgresql+asyncpg://surge:${POSTGRES_PASSWORD}@localhost:5432/surge
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TAILSCALE_URL: ${TAILSCALE_URL}        # Ollama OpenAI-compatible endpoint, e.g. http://localhost:11434/v1
      CORS_ORIGINS: ${CORS_ORIGINS:-}        # leave blank to allow all (internal/Tailscale-only)
    volumes:
      - ./surge-ai/log:/app/log
      - ./surge-ai/scan_results:/app/scan_results
      - ./surge-ai/output:/app/output
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./web-page
      args:
        # Baked in at build time — must be the server's Tailscale address, not localhost.
        NEXT_PUBLIC_API_URL: http://${SERVER_ADDR}:8000
        NEXT_PUBLIC_WS_URL: ws://${SERVER_ADDR}:8000
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  pgdata:
